services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - app_data:/app/data
    expose:
      - "8000"
  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set a domain pointing to the server}
      SITE_USER: ${SITE_USER:?Set a visitor login name}
      SITE_PASSWORD_HASH: ${SITE_PASSWORD_HASH:?Set a Caddy password hash}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  caddy_data:
  caddy_config:
